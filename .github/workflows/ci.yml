name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        node: [22.22.2, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Pin npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@10.9.8
      - name: Report toolchain
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run text-layout-data:verify
      - run: npm run fixtures:verify
      - run: npm run schema-conformance:verify
      - run: npm run identity:verify
      - run: npm run licenses:verify
      - run: npm audit --audit-level=low
      - run: npm run pack:core:dry-run
      - if: matrix.node == 24
        run: npm run test:coverage
      - if: matrix.node == 24
        run: npm run examples:verify
      - name: Installed-package consumer smoke
        run: npm run test:package-consumer
