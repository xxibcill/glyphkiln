name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run text-layout-data:verify
      - run: npm run fixtures:verify
      - run: npm run licenses:verify
      - run: npm audit --audit-level=low
      - run: npm pack --dry-run
      - if: matrix.node == 24
        run: npm run test:coverage
      - if: matrix.node == 24
        run: npm run examples:verify
      - if: matrix.node == 24
        name: Installed-package consumer smoke
        run: npm run test:package-consumer
